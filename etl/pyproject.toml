[project]
name = "weather-etl"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyspark==4.2.0",
  "delta-spark==4.4.1",
  "deltalake[pyarrow]>=1.6",
  "httpx>=0.28",
  "pydantic>=2.13",
  "pyyaml>=6.0",
  "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_etl"]
