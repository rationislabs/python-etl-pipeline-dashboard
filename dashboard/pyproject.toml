[project]
name = "weather-dash"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dash==4.4.1",
  "plotly==7.1.0",
  "pandas>=2.2",
  "numpy>=2.0",
  "deltalake[pyarrow]>=1.6",
  "pyyaml>=6.0",
  "gunicorn>=23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_dash"]
