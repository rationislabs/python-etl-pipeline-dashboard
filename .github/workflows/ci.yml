name: CI
on: [push]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Invoke
      run: pip install invoke
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run tests
      run: inv test
    - name: Build Docker images
      run: inv build