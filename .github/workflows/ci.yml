name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest --cov=weather_etl --cov=weather_dash --cov-report=term-missing

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          LOCAL_UID: "1001"
      - run: docker compose run --rm --no-deps -T airflow-scheduler pytest -q /opt/airflow/tests
        env:
          LOCAL_UID: "1001"
